<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MetroParcel | Admin Login</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #eff6ff, #dbeafe);
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 20px 50px rgba(37, 99, 235, 0.15);
        }

        .logo {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .logo span {
            color: #2563eb;
        }

        h2 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 18px;
        }

        label {
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            padding: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background: #1d4ed8;
        }

        #message {
            display: none;
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #64748b;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            color: #2563eb;
        }

    </style>
</head>

<body>

    <div class="login-container">

        <div class="logo">
            🚇 <span>MetroParcel</span>
        </div>

        <h2>Admin Login</h2>

        <p class="subtitle">
            Sign in to manage parcel deliveries.
        </p>

        <form id="loginForm">

            <div class="form-group">

                <label>Username</label>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter admin username"
                    required>

            </div>

            <div class="form-group">

                <label>Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required>

            </div>

            <button type="submit">
                Login →
            </button>

        </form>

        <div id="message"></div>

        <a
            href="index.html"
            class="back-link">

            ← Back to Customer Portal

        </a>

    </div>


    <script>

        document
            .getElementById("loginForm")
            .addEventListener(
                "submit",
                function (event) {

                    event.preventDefault();

                    const username =
                        document
                            .getElementById("username")
                            .value
                            .trim();

                    const password =
                        document
                            .getElementById("password")
                            .value
                            .trim();


                    /*
                     * Simple demonstration login
                     */

                    if (
                        username === "admin"
                        &&
                        password === "admin123"
                    ) {

                        localStorage.setItem(
                            "metroParcelAdmin",
                            "true"
                        );

                        window.location.href =
                            "admin.html";

                    }

                    else {

                        const message =
                            document
                                .getElementById("message");

                        message.style.display =
                            "block";

                        message.style.background =
                            "#fee2e2";

                        message.style.color =
                            "#b91c1c";

                        message.innerText =
                            "Invalid username or password.";

                    }

                }
            );

    </script>

</body>
</html>
